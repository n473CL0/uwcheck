name: Bug report
description: Something is wrong or broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't paste your Canvas feed URL, Ed token or `config.json`.** The feed URL works like a password: anyone with it can see your calendar.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Which source is it about?
      options: [Canvas, Ed, Course site, Not about a source]
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Hover the red dot next to the source in the header and copy what it says.
  - type: input
    id: version
    attributes:
      label: UWCheck version
      description: If you know it. Also say whether the header shows an Update button.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
