name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing), so no npm token is stored

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      - name: Smoke test
        run: |
          node --check server.js
          node server.js --version

      - run: npm publish
